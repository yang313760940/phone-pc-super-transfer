.card{display:flex;flex-direction:column;align-items:center;gap:14px}
.card img{border-radius:0;display:block}

<div class="card"><img src="A_mic_wave.svg" width="200" height="200"><div class="cap">A 麦克风+波形</div>

<div class="card"><img src="B_mic_circle.svg" width="200" height="200"><div class="cap">B 圆形徽章麦克风</div>
  <div class="small"><img src="B_mic_circle.svg" width="72" height="72"><img src="B_mic_circle.svg" width="48" height="48"></div></div>
<div class="card"><img src="C_wave_to_text.svg" width="200" height="200"><div class="cap">C 声波→文字条</div>
  <div class="small"><img src="C_wave_to_text.svg" width="72" height="72"><img src="C_wave_to_text.svg" width="48" height="48"></div></div>
<div class="card"><img src="D_transfer.svg" width="200" height="200"><div class="cap">D 手机→电脑传输</div>
  <div class="small"><img src="D_transfer.svg" width="72" height="72"><img src="D_transfer.svg" width="48" height="48"></div></div>
